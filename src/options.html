<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Spotibits</title>
<style>
  body {
    width: 230px;
    margin: 0;
    padding: 12px 14px;
    font: 13px/1.45 system-ui, -apple-system, sans-serif;
    background: #121212;
    color: #fff;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 600;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .row span { color: #b3b3b3; }
  button#enabled {
    position: relative;
    width: 34px;
    height: 18px;
    border-radius: 9px;
    border: none;
    padding: 0;
    cursor: pointer;
    background: #b3b3b3;
  }
  button#enabled .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    transition: transform .12s;
  }
  #status {
    margin: 10px 0 0;
    font-size: 12px;
    color: #b3b3b3;
  }
</style>
</head>
<body>
  <h1>Spotibits</h1>
  <div class="row">
    <span>Extension</span>
    <button id="enabled" type="button" role="switch" aria-label="Enable Spotibits"><span class="knob"></span></button>
  </div>
  <p id="status">…</p>
  <script src="options.js"></script>
</body>
</html>
